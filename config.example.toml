[server]
# Bind only localhost when using a reverse proxy.
# For Docker Compose, use "0.0.0.0:6710" so the Caddy container can reach pkvsyncd.
bind_addr = "127.0.0.1:6710"

# Generate with: pkvsyncd genkey
# Share URL format: https://sync.example.com/k_xxx/
deployment_key = "k_replace_me"

# Optional, but REQUIRED for the admin web UI's write actions: CSRF-protected
# admin POSTs (/admin/users, /admin/settings, ...) accept only requests whose
# Origin matches this host, so without it every admin form submission fails
# with 403 "csrf validation failed". Also used to build share URLs and marks
# the admin session cookie Secure. Set it on every TLS deployment:
# public_host = "sync.example.com"
# Local/SSH-tunnel plain-HTTP admin without public_host: see [admin] below.

[storage]
# PKV Sync data directory. Contains metadata.db, vaults/, blobs/.
data_dir = "/var/lib/pkv-sync"
db_path = "/var/lib/pkv-sync/metadata.db"

[network]
# Only trust X-Forwarded-For from these proxies.
# Same-machine Caddy/Nginx defaults:
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[admin]
# Escape hatch for deployments that cannot set [server].public_host (loopback
# or trusted-network plain-HTTP admin). When true, the admin CSRF origin
# check is DISABLED — any origin may post to /admin/* — and the session
# cookie is issued without the Secure flag. The server refuses to start if
# this is combined with a non-loopback bind and no public_host. Only enable
# on loopback or a fully trusted network.
# allow_insecure_admin = false

[mcp]
# MCP Streamable HTTP is served only embedded in the main `pkvsyncd serve`
# listener (at /mcp, still requiring the deployment key and a bearer device
# token); the standalone `pkvsyncd mcp --transport http` deployment was
# removed. Defaults to true; set false to disable the embedded endpoint.
# embed_in_serve = true

[logging]
level = "info"
format = "json"

[update_check]
# On a fresh database, these values seed the runtime settings stored in SQLite.
# After first boot, change enabled/interval_seconds from the Admin WebUI Runtime
# Settings page; admin edits persist across restarts. Set enabled = false for
# air-gapped hosts.
enabled = true
interval_seconds = 86400
repo = "cyberkurry/pkv-sync"
